name: cli

on:
  pull_request:
    paths:
      - 'cli/**'
      - 'mise.toml'
      - 'VERSION'
      - 'skills/specwright-pr/scripts/sw-path.sh'
      - '.github/workflows/cli.yml'
      - '.github/workflows/sw-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/sw-build.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
