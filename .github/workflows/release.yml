name: release

# Builds and checks sw for every platform through sw-build.yml, then attaches the five binaries and SHA256SUMS to the
# published release (cli/tool/attach_release.py). SHA256SUMS is uploaded last and seals the release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to build and attach, for example v0.24.0.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sw-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/sw-build.yml
    with:
      ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}

  attach:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: sw-*
          merge-multiple: true
          path: ${{ runner.temp }}/dist
      - name: Attach the binaries and seal the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python cli/tool/attach_release.py --tag "$TAG" --version-file VERSION --dist "$RUNNER_TEMP/dist" --repo ${{ github.repository }}
