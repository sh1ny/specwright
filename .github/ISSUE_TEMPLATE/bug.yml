name: Bug report
description: Something in Specwright doesn't work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Only the first box is required; fill in what you can, and "not sure" is a fine answer.
        Found a security problem? Please don't post it here. Report it privately as [SECURITY.md](https://github.com/sh1ny/specwright/blob/main/SECURITY.md) describes.
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What went wrong? A sentence or two is enough.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, step by step. Write "intermittent" or "unknown" if you can't make it happen again.
      placeholder: |
        1.
        2.
        3.
  - type: textarea
    id: environment
    attributes:
      label: Version and environment
      description: Whatever you know of these. Leave out what you don't.
      placeholder: |
        Specwright version (openspec/.specwright/VERSION):
        OpenSpec version (openspec --version):
        Agent harness and model (Claude Code, Codex, OMP, other):
        OS:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Your best guess is fine. Leave it empty if you're not sure.
      options:
        - Install or update
        - specwright-branch
        - specwright-commit
        - specwright-review
        - specwright-pr
        - specwright-finish
        - specwright-roadmap
        - specwright-release
        - sw CLI
        - Schema and templates
        - Docs and README
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: "Agent transcripts can include file paths and code from your project. Trim them to the part that shows the problem."
