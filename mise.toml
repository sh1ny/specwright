[tools]
# C18: THIRD_PARTY_NOTICES.txt covers the runtime embedded by dart compile exe.
# Its inventory uses this pinned SDK and its default desktop build.
# Changing this SDK pin or build flags requires a new runtime notice inventory;
# binary hashes cannot detect stale attribution.
dart = "3.13.7"

[tasks.deps]
description = "Fetch the dependencies of cli/ exactly as pubspec.lock pins them"
dir = "cli"
run = "dart pub get --enforce-lockfile"

[tasks.test]
description = "Run the Dart tests of cli/"
dir = "cli"
run = "dart test"

[tasks.analyze]
description = "Analyze cli/"
dir = "cli"
run = "dart analyze --fatal-infos"

[tasks.format]
description = "Check the formatting of cli/"
run = "dart format --output=none --set-exit-if-changed cli"

[tasks.build]
description = "Compile cli/bin/sw.dart to cli/build/sw with SW_VERSION from VERSION"
dir = "cli"
run = "dart run tool/build.dart"

[tasks.install-sw]
description = "Build sw from the tree and place it at ~/.specwright/bin/<VERSION>/ for the projects at that version"
depends = ["build"]
run = "bash scripts/install-sw.sh"
